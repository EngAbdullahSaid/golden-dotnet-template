name: 'Technical Debt'
description: 'Create a Technical Debt issue'
title: '[Debt] '
labels: ['tech-debt']
body:
  - type: textarea
    id: field1
    attributes:
      label: 'Description'
    validations:
      required: true
  - type: textarea
    id: field2
    attributes:
      label: 'Impact'
    validations:
      required: true
  - type: textarea
    id: field3
    attributes:
      label: 'Proposed fix'
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related IDs
      description: Requirement, use case, ADR or parent issue IDs (for example FR-001, UC-001).
