name: 'Architecture Decision'
description: 'Create a Architecture Decision issue'
title: '[ADR] '
labels: ['adr']
body:
  - type: textarea
    id: field1
    attributes:
      label: 'Context'
    validations:
      required: true
  - type: textarea
    id: field2
    attributes:
      label: 'Options considered'
    validations:
      required: true
  - type: textarea
    id: field3
    attributes:
      label: 'Proposed decision'
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related IDs
      description: Requirement, use case, ADR or parent issue IDs (for example FR-001, UC-001).
