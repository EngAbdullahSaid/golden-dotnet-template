name: 'User Story'
description: 'Create a User Story issue'
title: '[US] '
labels: ['user-story']
body:
  - type: textarea
    id: field1
    attributes:
      label: 'Story (As a / I want / so that)'
    validations:
      required: true
  - type: textarea
    id: field2
    attributes:
      label: 'Acceptance criteria (Given/When/Then)'
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related IDs
      description: Requirement, use case, ADR or parent issue IDs (for example FR-001, UC-001).
