name: 'Bug'
description: 'Create a Bug issue'
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: field1
    attributes:
      label: 'Steps to reproduce'
    validations:
      required: true
  - type: textarea
    id: field2
    attributes:
      label: 'Expected behavior'
    validations:
      required: true
  - type: textarea
    id: field3
    attributes:
      label: 'Actual behavior'
    validations:
      required: true
  - type: textarea
    id: field4
    attributes:
      label: 'Environment'
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related IDs
      description: Requirement, use case, ADR or parent issue IDs (for example FR-001, UC-001).
