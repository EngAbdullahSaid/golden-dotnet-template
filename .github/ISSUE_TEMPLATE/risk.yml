name: 'Risk'
description: 'Create a Risk issue'
title: '[Risk] '
labels: ['risk']
body:
  - type: textarea
    id: field1
    attributes:
      label: 'Description'
    validations:
      required: true
  - type: textarea
    id: field2
    attributes:
      label: 'Likelihood and impact'
    validations:
      required: true
  - type: textarea
    id: field3
    attributes:
      label: 'Mitigation'
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related IDs
      description: Requirement, use case, ADR or parent issue IDs (for example FR-001, UC-001).
